<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Revisa tus regalos navideños para perros y gatos, elimina productos y consulta el total de tu carrito."
    />
    <meta name="theme-color" content="#a82036" />

    <title>Mi carrito | Tienda Navideña para peludos</title>

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>

  <body>
    <header>
      <h1>Mi carrito</h1>
      <a href="/">Volver a la tienda</a>
    </header>

    <main aria-label="Productos y resumen del carrito">
      <div id="cart-products" class="gallery"></div>

      <div class="cart-summary">
        <p id="cart-total" class="price" role="status" aria-atomic="true"></p>

        <button type="button" id="clear-cart">Vaciar carrito</button>
      </div>
    </main>

    <script type="module" src="/src/carrito.ts"></script>
  </body>
</html>
